# 맥 설치 파일(.dmg)은 macOS에서만 만들 수 있어 GitHub Actions에서 빌드한다.
# Windows 쪽 `npm run release`로 GitHub Release가 올라오면 같은 릴리스에 dmg를 덧붙인다.
# 수동 실행(workflow_dispatch)은 최신 릴리스에 덧붙인다.
name: mac

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: overlay/package-lock.json
      - run: npm ci
        working-directory: overlay
      - run: npm run dist:mac
        working-directory: overlay
      - name: 릴리스에 dmg 올리기
        working-directory: overlay
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="${TAG:-$(gh release view --json tagName -q .tagName)}"
          gh release upload "$TAG" release/*.dmg --clobber
          # 릴리스 설명 맨 위에 윈도우용·맥용 다운로드 링크를 적는다. 원래 설명(패치노트, overlay/build/release-notes.md)은 그 아래에 남긴다
          # 다시 돌려도 링크가 겹치지 않게, 이미 붙은 링크 부분은 떼고 붙인다
          BODY="$(gh release view "$TAG" --json body -q .body | sed '/^## 🪟/,/^<!-- notes -->$/d')"
          # npm run release는 설명을 비워 올린다 → 비어 있으면 저장소의 패치노트를 넣는다
          [ -n "$(echo "$BODY" | tr -d '[:space:]')" ] || BODY="$(cat build/release-notes.md)"
          V="${TAG#v}"
          D="https://github.com/${{ github.repository }}/releases/download/$TAG"
          gh release edit "$TAG" --notes "## 🪟 윈도우 사용자용 · Windows
          **[MoHaZi-Setup-$V.exe 받기 · Download]($D/MoHaZi-Setup-$V.exe)** → 받아서 실행합니다. Download and run it.

          ## 🍎 맥북 사용자용 · macOS
          - Apple 칩 · Apple silicon (M1·M2·M3·M4): **[MoHaZi-$V-arm64.dmg 받기 · Download]($D/MoHaZi-$V-arm64.dmg)**
          - 인텔 맥 · Intel Mac: **[MoHaZi-$V-x64.dmg 받기 · Download]($D/MoHaZi-$V-x64.dmg)**

          내 맥 칩 확인: 왼쪽 위 Apple 메뉴 → 이 Mac에 관하여 → '칩' 또는 '프로세서'.
          Check your chip: Apple menu → About This Mac → Chip or Processor.

          설치 방법은 [README](https://github.com/${{ github.repository }}#설치)를 보세요. Install guide: [README (English)](https://github.com/${{ github.repository }}#english).

          <!-- notes -->

          $BODY"
