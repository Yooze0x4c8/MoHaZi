# 맥 설치 파일(.dmg)은 macOS에서만 만들 수 있어 GitHub Actions에서 빌드한다.
# Windows 쪽 `npm run release`로 GitHub Release가 올라오면 같은 릴리스에 dmg를 덧붙인다.
# 수동 실행(workflow_dispatch)은 최신 릴리스에 덧붙인다.
name: mac

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: overlay/package-lock.json
      - run: npm ci
        working-directory: overlay
      - run: npm run dist:mac
        working-directory: overlay
      - name: 릴리스에 dmg 올리기
        working-directory: overlay
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="${TAG:-$(gh release view --json tagName -q .tagName)}"
          gh release upload "$TAG" release/*.dmg --clobber
          # 릴리스 설명에 윈도우용·맥용 다운로드 링크를 나눠 적는다
          V="${TAG#v}"
          D="https://github.com/${{ github.repository }}/releases/download/$TAG"
          gh release edit "$TAG" --notes "## 🪟 윈도우 사용자용
          **[MoHaZi-Setup-$V.exe 받기]($D/MoHaZi-Setup-$V.exe)** → 받아서 실행합니다.

          ## 🍎 맥북 사용자용
          - Apple 칩 (M1·M2·M3·M4): **[MoHaZi-$V-arm64.dmg 받기]($D/MoHaZi-$V-arm64.dmg)**
          - 인텔 맥: **[MoHaZi-$V-x64.dmg 받기]($D/MoHaZi-$V-x64.dmg)**

          내 맥 칩 확인: 왼쪽 위 Apple 메뉴 → 이 Mac에 관하여 → '칩' 또는 '프로세서'.

          설치 방법은 [README](https://github.com/${{ github.repository }}#설치)를 보세요."
